# prefix ---------------------------------------------------------------------------
set -g prefix C-a
bind C-a send-prefix

# behavior -------------------------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi
set -g status-keys emacs

# terminal -------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,foot*:Tc,xterm-kitty:Tc"

# keys -----------------------------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# theme (matches ~/.config/foot/foot.ini) ------------------------------------------
set -g status-style "bg=#263238,fg=#cfd8dc"
set -g status-left " #[fg=#03a9f4,bold]#S#[default] "
set -g status-left-length 40
set -g status-right "#[fg=#8bc34a]#h #[fg=#546e7a]| #[fg=#ffc107]%b %d %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=#03a9f4,fg=#263238,bold"
set -g pane-border-style "fg=#37474f"
set -g pane-active-border-style "fg=#03a9f4"
set -g message-style "bg=#37474f,fg=#eceff1"
