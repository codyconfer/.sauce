[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 8 }
dynamic_padding = false
opacity = 1.0
dimensions = { columns = 120, lines = 69 }

[scrolling]
history = 500

[font]
size = 8

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[colors.primary]
background = "#263238"
foreground = "#eceff1"

[colors.cursor]
text = "#263238"
cursor = "#eceff1"

[colors.selection]
text = "#263238"
background = "#03a9f4"

[colors.normal]
black = "#263238"
red = "#ff9800"
green = "#8bc34a"
yellow = "#ffc107"
blue = "#03a9f4"
magenta = "#e91e63"
cyan = "#009688"
white = "#cfd8dc"

[colors.bright]
black = "#37474f"
red = "#ffa74d"
green = "#9ccc65"
yellow = "#ffa000"
blue = "#81d4fa"
magenta = "#ad1457"
cyan = "#26a69a"
white = "#eceff1"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
